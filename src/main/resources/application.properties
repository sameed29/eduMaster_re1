# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8081
server.servlet.context-path=/

# ========================================
# JSP VIEW CONFIGURATION
# ========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Disable Thymeleaf (if dependency exists)
spring.thymeleaf.enabled=false


# Razorpay Configuration (Test Mode)
razorpay.key.id=rzp_test_SzbRTIZZIUH9pw
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR
# ========================================
# POSTGRESQL DATABASE CONFIGURATION (AIVEN CLOUD)
# ========================================
spring.datasource.url=jdbc:postgresql://pg-1c39e555-ritikrathore73423-be07.c.aivencloud.com:13123/edumaster?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ye line REMOVE karo ya change karo:
# spring.datasource.hikari.initialization-fail-timeout=-1   ← HATAO YE

# Aur ye add karo:
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
## HIKARICP CONNECTION POOL (OPTIMIZED FOR CLOUD)

# ========================================
# Reduced pool size for cloud database
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Increased timeouts for cloud connectivity
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000

# Auto-reconnect settings
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=-1

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection handling
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ========================================
# EMAIL CONFIGURATION (GMAIL)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=keshavpatlawdiya@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debug email issues (set to true for debugging)
spring.mail.properties.mail.debug=false

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# ========================================
# CLOUDINARY CONFIGURATION
# ========================================
cloudinary.cloud-name=df9afoenn
cloudinary.api-key=262622358469544
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# Local File Storage Path (Fallback)
file.upload-dir=./uploads

# ========================================
# SESSION CONFIGURATION
# ========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=EDUMASTER_SESSION

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.vp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Additional logging for connection issues
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=DEBUG

# ========================================
# APPLICATION METADATA
# ========================================
spring.application.name=EduMaster
application.version=1.0.0

# ========================================
# TIMEZONE CONFIGURATION
# ========================================
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ========================================
# ACTUATOR & MONITORING
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========================================
# JACKSON JSON CONFIGURATION
# ========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ========================================
# ERROR HANDLING
# ========================================
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# ========================================
# SPRING BOOT DEVTOOLS (OPTIONAL)
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true