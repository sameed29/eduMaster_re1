# ========================================
# SERVER CONFIGURATION (RENDER & PORT FIX)
# ========================================
# Explicitly bind to all network interfaces for Render port detection
server.address=0.0.0.0
# Render dynamically passes $PORT (usually 10000). Fallback to 8081 for local development.
server.port=${PORT:8081}
server.servlet.context-path=/

# ========================================
# TOMCAT & JSP PERFORMANCE OPTIMIZATION
# ========================================
# Speeds up startup by skipping TLD scanning for non-taglib JARs
server.tomcat.additional-tld-skip-patterns=spring-*.jar,tomcat-embed-*.jar,hibernate-*.jar,postgresql-*.jar,jackson-*.jar,lombok-*.jar,commons-*.jar,cloudinary-*.jar,razorpay-*.jar,logback-*.jar,slf4j-*.jar

# Fast startup: Disable lazy initialization so Tomcat binds to Render's port immediately
spring.main.lazy-initialization=false

# ========================================
# JSP VIEW CONFIGURATION
# ========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Disable Thymeleaf explicitly since JSP is used
spring.thymeleaf.enabled=false

# ========================================
# THIRD-PARTY INTEGRATIONS (RAZORPAY & CLOUDINARY)
# ========================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SzbRTIZZIUH9pw}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:df9afoenn}
cloudinary.api-key=${CLOUDINARY_API_KEY:262622358469544}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ========================================
# POSTGRESQL DATABASE CONFIGURATION (AIVEN CLOUD)
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-1c39e555-ritikrathore73423-be07.c.aivencloud.com:13123/edumaster?sslmode=require&tcpKeepAlive=true}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ========================================
# HIKARICP CONNECTION POOL (OPTIMIZED FOR 512MB RAM)
# ========================================
# Cap maximum connections to stay under free-tier database limits
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Increased to 15 seconds to eliminate false-positive leak warnings over cloud network latency
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.auto-commit=true

# Async startup: don't block Tomcat port binding while waiting on DB pool initialization
spring.datasource.hikari.initialization-fail-timeout=-1

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OSIV disabled for proper connection release
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ========================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:keshavpatlawdiya@gmail.com}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# ========================================
# FILE UPLOAD & STATIC RESOURCES
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

spring.web.resources.static-locations=classpath:/static/,classpath:/public/
file.upload-dir=/app/uploads

# ========================================
# SESSION CONFIGURATION
# ========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=EDUMASTER_SESSION

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.vp=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

# ========================================
# APPLICATION METADATA & ACTUATOR
# ========================================
spring.application.name=EduMaster
application.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Jackson Settings
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Error Handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# ========================================
# DEVTOOLS (DISABLED FOR PRODUCTION)
# ========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false